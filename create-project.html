<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mestre — Criador de Jornadas</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0b1020;
      color:white;
      min-height:100vh;
      padding:30px;
      background:
        radial-gradient(circle at top left, #1d4ed8 0%, transparent 25%),
        radial-gradient(circle at bottom right, #7c3aed 0%, transparent 25%),
        #0b1020;
    }

    .container{
      max-width:1200px;
      margin:auto;
      display:grid;
      grid-template-columns: 1fr 400px;
      gap:20px;
    }

    .panel{
      background:rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:20px;
      padding:25px;
      box-shadow:0 0 30px rgba(0,0,0,0.3);
    }

    h1{
      font-size:32px;
      margin-bottom:10px;
    }

    .subtitle{
      color:#94a3b8;
      margin-bottom:25px;
    }

    .section-title{
      font-size:20px;
      margin-bottom:15px;
      color:#60a5fa;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .field{
      margin-bottom:15px;
    }

    .field.full{
      grid-column:1 / -1;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      color:#cbd5e1;
    }

    input, textarea{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#111827;
      color:white;
      outline:none;
      border:1px solid transparent;
      transition:0.2s;
    }

    input:focus,
    textarea:focus{
      border-color:#3b82f6;
      box-shadow:0 0 0 3px rgba(59,130,246,0.2);
    }

    textarea{
      resize:vertical;
      min-height:90px;
    }

    .mission-card{
      background:#111827;
      border-radius:16px;
      padding:18px;
      margin-bottom:15px;
      border:1px solid rgba(255,255,255,0.08);
      position:relative;
      animation:fade .2s ease;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .remove-btn{
      position:absolute;
      top:12px;
      right:12px;
      background:#ef4444;
      border:none;
      color:white;
      width:28px;
      height:28px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    .checkbox{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:10px;
    }

    .checkbox input{
      width:auto;
    }

    button{
      border:none;
      cursor:pointer;
      transition:0.2s;
    }

    .primary-btn{
      background:linear-gradient(135deg,#2563eb,#7c3aed);
      color:white;
      padding:14px 18px;
      border-radius:14px;
      font-weight:bold;
      width:100%;
      margin-top:10px;
    }

    .primary-btn:hover{
      transform:translateY(-2px);
      opacity:0.95;
    }

    .secondary-btn{
      background:#111827;
      color:white;
      padding:12px 18px;
      border-radius:12px;
      margin-top:15px;
      border:1px solid rgba(255,255,255,0.1);
      width:100%;
    }

    .preview{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .preview-card{
      background:#111827;
      padding:18px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.08);
    }

    .preview-card h3{
      color:#60a5fa;
      margin-bottom:10px;
    }

    .preview-mission{
      padding:10px;
      border-radius:10px;
      background:rgba(255,255,255,0.04);
      margin-top:10px;
    }

    .required{
      color:#22c55e;
      font-size:12px;
      margin-top:5px;
    }

    .optional{
      color:#f59e0b;
      font-size:12px;
      margin-top:5px;
    }

    .page-nav{
      display:flex;
      justify-content:flex-start;
      margin-bottom:20px;
      gap:12px;
    }

    .page-nav a{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:12px 18px;
      border-radius:14px;
      background:rgba(255,255,255,.08);
      color:#fff;
      text-decoration:none;
      border:1px solid rgba(255,255,255,.12);
      transition:.2s;
    }

    .page-nav a:hover{
      background:rgba(255,255,255,.15);
    }

    pre{
      background:#020617;
      color:#38bdf8;
      padding:20px;
      border-radius:16px;
      overflow:auto;
      margin-top:20px;
      max-height:400px;
      border:1px solid rgba(255,255,255,0.1);
    }

    @media(max-width:900px){
      .container{
        grid-template-columns:1fr;
      }

      .grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

  <div class="page-nav">
    <a href="index.html">← Voltar à página inicial</a>
  </div>

  <div class="container">

    <!-- FORM -->
    <div class="panel">

      <h1>🎮 Mestre de Jornadas</h1>
      <p class="subtitle">
        Crie capítulos, missões e exporte o JSON do seu projeto gameficado.
      </p>

      <div class="section-title">
        Informações do Capítulo
      </div>

      <div class="grid">

        <div class="field">
          <label>Título</label>
          <input id="chapterTitle" placeholder="Capítulo 1 — Fundação do Reino">
        </div>

        <div class="field">
          <label>Reward</label>
          <input id="chapterReward" placeholder="Conquista: Fundação Estável">
        </div>

        <div class="field full">
          <label>Descrição</label>
          <textarea id="chapterDescription"></textarea>
        </div>

        <div class="field full">
          <label>Boss Final</label>
          <textarea id="chapterBoss"></textarea>
        </div>

      </div>

      <br>

      <div class="section-title">
        Missões
      </div>

      <div id="missionsContainer"></div>

      <button class="secondary-btn" onclick="addMission()">
        + Adicionar Missão
      </button>

      <button class="primary-btn" onclick="generateJSON()">
        ⚡ Gerar JSON
      </button>

      <pre id="jsonOutput"></pre>

    </div>

    <!-- PREVIEW -->
    <div class="panel">

      <div class="section-title">
        Preview
      </div>

      <div class="preview" id="preview"></div>

    </div>

  </div>

  <script>

    let missionCount = 0;

    function addMission() {

      missionCount++;

      const missionHTML = `
        <div class="mission-card" id="mission-${missionCount}">

          <button class="remove-btn" onclick="removeMission(${missionCount})">
            ×
          </button>

          <div class="field">
            <label>Título da Missão</label>
            <input class="mission-title" placeholder="Criar projeto Next.js">
          </div>

          <div class="field">
            <label>XP</label>
            <input class="mission-xp" type="number" placeholder="50">
          </div>

          <div class="field">
            <label>Critério de Conclusão</label>
            <textarea class="mission-criteria"></textarea>
          </div>

          <div class="checkbox">
            <input class="mission-required" type="checkbox" checked>
            <label>Missão obrigatória</label>
          </div>

        </div>
      `;

      document
        .getElementById("missionsContainer")
        .insertAdjacentHTML("beforeend", missionHTML);

      updatePreview();
      attachListeners();
    }

    function removeMission(id){
      document.getElementById(`mission-${id}`).remove();
      updatePreview();
    }

    function getData(){

      const missions = [];

      document.querySelectorAll(".mission-card").forEach(card => {

        missions.push({
          title: card.querySelector(".mission-title").value,
          xp: Number(card.querySelector(".mission-xp").value),
          doneCriteria: card.querySelector(".mission-criteria").value,
          required: card.querySelector(".mission-required").checked
        });

      });

      return {
        title: document.getElementById("chapterTitle").value,
        description: document.getElementById("chapterDescription").value,
        boss: document.getElementById("chapterBoss").value,
        reward: document.getElementById("chapterReward").value,
        missions
      };
    }

    function generateJSON(){

      const data = getData();

      const finalJSON = [
        {
          title: data.title,
          description: data.description,
          boss: data.boss,
          reward: data.reward,
          missions: data.missions
        }
      ];

      document.getElementById("jsonOutput").textContent =
        JSON.stringify(finalJSON, null, 2);

    }

    function updatePreview(){

      const data = getData();

      const totalXP = data.missions.reduce((acc,m)=>acc+(m.xp || 0),0);

      document.getElementById("preview").innerHTML = `
        <div class="preview-card">

          <h3>${data.title || "Novo Capítulo"}</h3>

          <p style="color:#94a3b8;">
            ${data.description || "Descrição do capítulo..."}
          </p>

          <br>

          <p>
            <strong>Boss:</strong><br>
            ${data.boss || "-"}
          </p>

          <br>

          <p>
            <strong>Reward:</strong>
            ${data.reward || "-"}
          </p>

          <br>

          <p>
            <strong>XP Total:</strong>
            ${totalXP}
          </p>

          <br>

          ${
            data.missions.map(m => `
              <div class="preview-mission">
                <strong>${m.title || "Missão"}</strong>
                <div>${m.xp || 0} XP</div>
                <div class="${m.required ? "required":"optional"}">
                  ${m.required ? "Obrigatória":"Opcional"}
                </div>
              </div>
            `).join("")
          }

        </div>
      `;
    }

    function attachListeners(){

      document
        .querySelectorAll("input, textarea")
        .forEach(el => {
          el.oninput = updatePreview;
        });

    }

    attachListeners();
    addMission();

  </script>

</body>
</html>
